name: Build
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions: { contents: write }
jobs:
  mac:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci && npm run build
        working-directory: app
      - run: app/tools/fetch-tectonic.sh && app/tools/make-seed.sh
      - name: Tests
        run: npm test && (cd src-tauri && cargo test)
        working-directory: app
      - run: app/tools/release.sh
        env: { VERSION: "${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-ci' }}" }
      - uses: actions/upload-artifact@v4
        with: { name: MyLatex-dmg, path: dist/MyLatex.dmg }
      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" dist/MyLatex.dmg --generate-notes --title "MyLatex $GITHUB_REF_NAME"
        env: { GH_TOKEN: "${{ github.token }}" }
